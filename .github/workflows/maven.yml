# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: ci

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: financial_engine
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Test main application with MySQL
      run: |
        java -jar target/financial-engine-0.0.1-SNAPSHOT.jar \
          --spring.profiles.active=ci > app.log 2>&1 &
  
        APP_PID=$!
  
        for i in {1..30}; do
          if grep -q "Started FinancialEngineApplication" app.log; then
            echo "Application started successfully with MySQL!"
            kill $APP_PID
            wait $APP_PID 2>/dev/null || true
            exit 0
          fi
  
          if ! kill -0 $APP_PID 2>/dev/null; then
            cat app.log
            exit 1
          fi
  
          sleep 2
        done
  
        cat app.log
        kill $APP_PID 2>/dev/null || true
        exit 1

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: financial-engine
        path: target/*.jar

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
